# Copy this file to owners.local.yaml (same directory) and fill in the exact
# `Owner` values that appear in your Monarch transaction export.
#
# owners.local.yaml is gitignored and never committed — this is the one place
# real names are allowed to live, and only on your own machine.

azs:
  # Monarch "Owner" values that belong to household member AZS
  monarch_owner_names:
    - "REPLACE_WITH_PERSON_1_NAME"

ssp:
  # Monarch "Owner" values that belong to household member SSP
  monarch_owner_names:
    - "REPLACE_WITH_PERSON_2_NAME"

# Monarch "Owner" value used for jointly-owned transactions. Each shared
# transaction is split between AZS and SSP per `shared_split` below.
shared_owner_names:
  - "Shared"

shared_split:
  azs: 0.5
  ssp: 0.5
